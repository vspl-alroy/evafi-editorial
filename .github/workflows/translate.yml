name: Draft translations

# When English articles change on main, AI-draft any missing translations and open a PR for review.
# Existing translations are never overwritten (see scripts/translate.ts).
on:
  push:
    branches: [main]
    paths: ["content/*.md", "content/i18n/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Draft missing translations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/translate.ts
      - name: Open PR for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain content)" ]; then echo "Nothing to translate."; exit 0; fi
          branch="i18n/drafts-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content
          git commit -m "AI-drafted translations (needs review)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Translations: review AI drafts" \
            --body "AI-drafted translations. Each file starts with \`status=draft\`.

          Reviewer checklist:
          - [ ] Native-speaker pass: edit the text directly in this PR
          - [ ] Compliance pass: claims, numbers, disclaimers unchanged in meaning
          - [ ] Change \`status=draft\` to \`status=reviewed\` in each file you approve

          Once reviewed, the AI never rewrites the file. The \`Translation review\` check fails while any draft remains."
